<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#444"/></marker></defs>
<title>Jira Cloud Integration Architecture</title>
<rect width="960" height="660" fill="white"/>
<rect x="0" y="0" width="960" height="64" fill="#222" stroke="#222" stroke-width="0" rx="0"/><text x="480" y="26" font-size="21" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="white">Jira Cloud Integration</text><text x="480" y="50" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#aaa">Automatic ticket lifecycle linked to ephemeral environment events</text><rect x="18" y="84" width="240" height="480" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="8" stroke-dasharray="6 4"/><text x="28" y="100" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="italic" fill="#999">Platform event bus (Redis)</text><rect x="30" y="100" width="216" height="46" fill="#f5f5f5" stroke="#222" stroke-width="1" rx="6"/><text x="138" y="128" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">PROVISIONING</text><rect x="30" y="160" width="216" height="46" fill="#f5f5f5" stroke="#222" stroke-width="1" rx="6"/><text x="138" y="188" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">SEEDING</text><rect x="30" y="220" width="216" height="46" fill="#f5f5f5" stroke="#222" stroke-width="1" rx="6"/><text x="138" y="248" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">TESTING</text><rect x="30" y="280" width="216" height="46" fill="#f5f5f5" stroke="#222" stroke-width="1" rx="6"/><text x="138" y="308" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">COMPLETE</text><rect x="30" y="340" width="216" height="46" fill="#f5f5f5" stroke="#222" stroke-width="1" rx="6"/><text x="138" y="368" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">FAILED</text><rect x="30" y="400" width="216" height="46" fill="#f5f5f5" stroke="#222" stroke-width="1" rx="6"/><text x="138" y="428" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">DESTROYING</text><rect x="30" y="460" width="216" height="46" fill="#f5f5f5" stroke="#222" stroke-width="1" rx="6"/><text x="138" y="488" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">DESTROY_FAILED</text><rect x="310" y="140" width="220" height="280" fill="#f5f5f5" stroke="#222" stroke-width="2" rx="6"/><text x="420" y="161" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Jira Cloud adapter</text><text x="420" y="176" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[JiraIntegrationService]</text><line x1="324" y1="188" x2="516" y2="188" stroke="#ccc" stroke-width="1"/><text x="420" y="203" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Subscribes to lifecycle</text><text x="420" y="220" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">events via Redis.</text><text x="420" y="237" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Maps events to Jira</text><text x="420" y="254" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">actions using rules.</text><text x="420" y="271" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Idempotent — safe</text><text x="420" y="288" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">to re-trigger.</text><text x="420" y="305" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Enriches with log link,</text><text x="420" y="322" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">PR URL, cost estimate.</text><rect x="590" y="140" width="220" height="280" fill="#fafafa" stroke="#222" stroke-width="1" rx="6" stroke-dasharray="6 4"/><text x="700" y="161" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Jira Cloud</text><text x="700" y="176" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[External system]</text><line x1="604" y1="188" x2="796" y2="188" stroke="#ccc" stroke-width="1"/><text x="700" y="203" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">REST API v3.</text><text x="700" y="220" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Project: PLAT.</text><text x="700" y="237" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Issue type: Test-Run.</text><text x="700" y="254" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Auto-transitions via</text><text x="700" y="271" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">workflow automation.</text><text x="700" y="288" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Labels: ephemeral,</text><text x="700" y="305" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">team, pr-number.</text><rect x="830" y="84" width="110" height="480" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="8" stroke-dasharray="6 4"/><text x="840" y="100" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="italic" fill="#999">Ticket lifecycle</text><rect x="836" y="100" width="98" height="46" fill="white" stroke="#222" stroke-width="1" rx="6"/><text x="885" y="128" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">OPEN</text><rect x="836" y="160" width="98" height="46" fill="white" stroke="#222" stroke-width="1" rx="6"/><text x="885" y="188" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">IN PROGRESS</text><rect x="836" y="220" width="98" height="46" fill="white" stroke="#222" stroke-width="1" rx="6"/><text x="885" y="248" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">PASSED</text><rect x="836" y="280" width="98" height="46" fill="white" stroke="#222" stroke-width="1" rx="6"/><text x="885" y="308" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">FAILED</text><rect x="836" y="340" width="98" height="46" fill="white" stroke="#222" stroke-width="1" rx="6"/><text x="885" y="368" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">CLOSED</text><rect x="836" y="400" width="98" height="46" fill="white" stroke="#222" stroke-width="1" rx="6"/><text x="885" y="428" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">ESCALATED</text><rect x="18" y="580" width="924" height="60" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/><text x="480" y="594" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#333">Event → Jira action mapping</text><text x="18" y="612" font-size="9" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">PROVISIONING: Create ticket OPEN status, link PR URL</text><text x="326" y="612" font-size="9" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">TESTING: Transition → IN PROGRESS, attach env endpoint</text><text x="634" y="612" font-size="9" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">COMPLETE: Transition → PASSED, attach test report link</text><text x="18" y="630" font-size="9" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">FAILED: Transition → FAILED, attach log URL + cost estimate, notify assignee</text><text x="326" y="630" font-size="9" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">DESTROY_FAILED: Transition → ESCALATED, assign to platform team</text><text x="634" y="630" font-size="9" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">DESTROYED: Transition → CLOSED, add duration and final cost as comment</text><line x1="246" y1="123" x2="306.2" y2="270.7" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="246" y1="183" x2="304.5" y2="271.7" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="246" y1="243" x2="301.3" y2="275.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="246" y1="303" x2="300.6" y2="283.4" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="246" y1="363" x2="303.9" y2="287.9" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="246" y1="423" x2="305.9" y2="289.1" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="246" y1="483" x2="307.0" y2="289.5" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="530" y1="280" x2="580.0" y2="280.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="560.0" y="270.0" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">REST API v3</text><line x1="810" y1="280" x2="828.5" y2="155.9" stroke="#444" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ah)"/><line x1="810" y1="280" x2="827.4" y2="215.7" stroke="#444" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ah)"/><line x1="810" y1="280" x2="821.8" y2="271.7" stroke="#444" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ah)"/><line x1="810" y1="280" x2="826.0" y2="316.8" stroke="#444" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ah)"/><line x1="810" y1="280" x2="828.1" y2="376.2" stroke="#444" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ah)"/><line x1="810" y1="280" x2="828.8" y2="436.1" stroke="#444" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#ah)"/>
</svg>
