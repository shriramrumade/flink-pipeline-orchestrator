mily="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">OWASP checks.</text><line x1="678" y1="130" x2="718.0" y2="130.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="703.0" y="120.0" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">upload results</text><rect x="728" y="90" width="200" height="80" fill="#fafafa" stroke="#222" stroke-width="1" rx="6" stroke-dasharray="6 4"/><text x="828" y="111" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">SonarCloud</text><text x="828" y="126" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[External system]</text><line x1="742" y1="138" x2="914" y2="138" stroke="#ccc" stroke-width="1"/><text x="828" y="153" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Stores analysis.</text><text x="828" y="170" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Evaluates quality</text><text x="828" y="187" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">gate conditions.</text><text x="828" y="204" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Returns PASS/FAIL.</text><line x1="828" y1="170" x2="828.0" y2="210.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="828.0" y="185.0" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">gate status</text><rect x="628" y="220" width="400" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="828" y="241" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Quality gate check</text><text x="828" y="256" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Platform orchestrator]</text><line x1="642" y1="268" x2="1014" y2="268" stroke="#ccc" stroke-width="1"/><text x="828" y="283" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Poll SonarCloud API for gate status.</text><text x="828" y="300" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Timeout after 5 minutes.</text><text x="828" y="317" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Block terraform apply if FAILED.</text><line x1="678" y1="260" x2="488.0" y2="260.0" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="580" y="250" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#999">FAILED — block provision</text><line x1="628" y1="300" x2="409.4" y2="376.7" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="514.0" y="330.0" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">PASSED — continue</text><rect x="18" y="380" width="360" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="198" y="401" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">terraform apply</text><text x="198" y="416" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[AWS provision]</text><line x1="32" y1="428" x2="364" y2="428" stroke="#ccc" stroke-width="1"/><text x="198" y="443" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Proceed only if gate PASSED.</text><text x="198" y="460" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Quality issues caught</text><text x="198" y="477" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">before infra cost incurred.</text><line x1="378" y1="420" x2="418.0" y2="420.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><rect x="428" y="380" width="480" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="668" y="401" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Integration tests</text><text x="668" y="416" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[JUnit 5 + RestAssured]</text><line x1="442" y1="428" x2="894" y2="428" stroke="#ccc" stroke-width="1"/><text x="668" y="443" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Tests run against live stack.</text><text x="668" y="460" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Coverage uploaded to Sonar.</text><text x="668" y="477" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Final gate re-evaluated.</text><rect x="18" y="500" width="924" height="120" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/><text x="480" y="518" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#333">Default quality gate conditions  (configurable per team in env.yaml)</text><text x="30" y="536" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">Metric</text><text x="230" y="536" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">Condition</text><text x="430" y="536" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">Threshold</text><text x="600" y="536" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">Effect</text><text x="30" y="554" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#222">Coverage</text><text x="230" y="554" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">New code coverage</text><text x="430" y="554" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#222">≥ 80%</text><text x="600" y="554" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#888">FAILED if &lt; 80%</text><text x="30" y="570" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#222">Duplications</text><text x="230" y="570" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">New code duplications</text><text x="430" y="570" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#222">≤ 3%</text><text x="600" y="570" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#888">FAILED if &gt; 3%</text><text x="30" y="586" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#222">Security</text><text x="230" y="586" font-