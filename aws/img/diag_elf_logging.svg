<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#444"/></marker></defs>
<title>ELF Logging Architecture</title>
<rect width="960" height="700" fill="white"/>
<rect x="0" y="0" width="960" height="64" fill="#222" stroke="#222" stroke-width="0" rx="0"/><text x="480" y="26" font-size="21" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="white">ELF Logging Architecture</text><text x="480" y="50" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#aaa">Log collection, shipping, and centralised storage per ephemeral environment</text><rect x="18" y="84" width="280" height="460" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="8" stroke-dasharray="6 4"/><text x="28" y="100" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="italic" fill="#999">Ephemeral environment (per PR)</text><rect x="34" y="110" width="248" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="158" y="131" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Spring Boot app</text><text x="158" y="146" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[ECS Fargate]</text><line x1="48" y1="158" x2="268" y2="158" stroke="#ccc" stroke-width="1"/><text x="158" y="173" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Structured JSON logs</text><text x="158" y="190" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">to stdout/stderr.</text><text x="158" y="207" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Correlated with env-id.</text><rect x="34" y="210" width="248" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="158" y="231" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Flyway / seed runner</text><text x="158" y="246" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[CI task]</text><line x1="48" y1="258" x2="268" y2="258" stroke="#ccc" stroke-width="1"/><text x="158" y="273" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Migration &amp; seed logs.</text><text x="158" y="290" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Written to file.</text><text x="158" y="307" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Picked up by shipper.</text><rect x="34" y="310" width="248" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="158" y="331" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Test runner</text><text x="158" y="346" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[CI task]</text><line x1="48" y1="358" x2="268" y2="358" stroke="#ccc" stroke-width="1"/><text x="158" y="373" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">JUnit output.</text><text x="158" y="390" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">RestAssured request log.</text><text x="158" y="407" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Surefire XML.</text><rect x="34" y="410" width="248" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="158" y="431" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Teardown events</text><text x="158" y="446" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Orchestrator]</text><line x1="48" y1="458" x2="268" y2="458" stroke="#ccc" stroke-width="1"/><text x="158" y="473" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">PROVISIONED · SEEDING</text><text x="158" y="490" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">TESTING · DESTROYED.</text><text x="158" y="507" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Written to lifecycle log.</text><rect x="360" y="200" width="200" height="200" fill="#f5f5f5" stroke="#222" stroke-width="2" rx="6"/><text x="460" y="221" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Log shipper</text><text x="460" y="236" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Filebeat / Fluent Bit]</text><line x1="374" y1="248" x2="546" y2="248" stroke="#ccc" stroke-width="1"/><text x="460" y="263" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Collects all sources.</text><text x="460" y="280" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Adds metadata:</text><text x="460" y="297" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">  env-id = pr-{n}</text><text x="460" y="314" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">  team = payments</text><text x="460" y="331" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">  pr-number = 42</text><text x="460" y="348" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">  timestamp = UTC</text><text x="460" y="365" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Forwards to pipeline.</text><rect x="620" y="200" width="160" height="90" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="700" y="221" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Log pipeline</text><text x="700" y="236" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Logstash / Kinesis]</text><line x1="634" y1="248" x2="766" y2="248" stroke="#ccc" stroke-width="1"/><text x="700" y="263" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Parse &amp; enrich.</text><text x="700" y="280" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Add env context.</text><text x="700" y="297" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Route by team.</text><rect x="620" y="320" width="160" height="90" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="700" y="341" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">ELF store</text><text x="700" y="356" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Elasticsearch]</text><line x1="634" y1="368" x2="766" y2="368" stroke="#ccc" stroke-width="1"/><text x="700" y="383" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Index: logs-pr-{n}.</text><text x="700" y="400" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Retention: 7 days.</text><text x="700" y="417" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Snapshot on destroy.</text><rect x="620" y="440" width="160" height="70" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="700" y="461" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Kibana</text><text x="700" y="476" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Dashboard]</text><line x1="634" y1="488" x2="766" y2="488" stroke="#ccc" stroke-width="1"/><text x="700" y="503" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Per-env log view.</text><text x="700" y="520" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Test failure trace.</text><text x="700" y="537" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Error histogram.</text><rect x="820" y="260" width="120" height="150" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="880" y="281" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Cold archive</text><text x="880" y="296" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[S3 Glacier]</text><line x1="834" y1="308" x2="926" y2="308" stroke="#ccc" stroke-width="1"/><text x="880" y="323" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">PR logs archived</text><text x="880" y="340" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">after 7 days.</text><text x="880" y="357" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Retained 90 days.</text><text x="880" y="374" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Linked to Jira.</text><line x1="282" y1="150" x2="355.4" y2="291.1" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="282" y1="250" x2="351.6" y2="294.6" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="282" y1="350" x2="351.6" y2="305.4" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="282" y1="450" x2="355.4" y2="308.9" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="560" y1="300" x2="612.6" y2="251.8" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="590.0" y="262.5" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">enrich &amp; parse</text><line x1="620" y1="290" x2="620.0" y2="310.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="620" y1="410" x2="620.0" y2="430.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><line x1="780" y1="365" x2="811.5" y2="345.3" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="800.0" y="342.5" font-size="10" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">archive on destroy</text><text x="480" y="620" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#555">Every log line carries env-id, team, pr-number, and timestamp — enabling cross-env queries and Jira ticket enrichment.</text>
</svg>
