<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#444"/></marker></defs>
<title>Snapshot Management Architecture</title>
<rect width="960" height="700" fill="white"/>
<rect x="0" y="0" width="960" height="64" fill="#222" stroke="#222" stroke-width="0" rx="0"/><text x="480" y="26" font-size="21" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="white">Snapshot Management</text><text x="480" y="50" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#aaa">Capture, store, and restore environment snapshots to reproduce past test scenarios</text><text x="480" y="88" font-size="13" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#333">Capture flow</text><rect x="18" y="100" width="160" height="70" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="98" y="121" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Live env</text><text x="98" y="136" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[pr-{n}]</text><line x1="32" y1="148" x2="164" y2="148" stroke="#ccc" stroke-width="1"/><text x="98" y="163" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">ECS · RDS · S3</text><text x="98" y="180" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">running stack.</text><line x1="178" y1="135" x2="218.0" y2="135.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="203.0" y="125.0" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">trigger snapshot</text><rect x="228" y="100" width="200" height="70" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="328" y="121" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Snapshot engine</text><text x="328" y="136" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[SnapshotService]</text><line x1="242" y1="148" x2="414" y2="148" stroke="#ccc" stroke-width="1"/><text x="328" y="163" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">1. RDS snapshot (AWS).</text><text x="328" y="180" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">2. S3 bucket clone.</text><text x="328" y="197" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">3. env.yaml + git SHA.</text><text x="328" y="214" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">4. Write manifest.</text><line x1="428" y1="135" x2="468.0" y2="135.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="453.0" y="125.0" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">store</text><rect x="478" y="100" width="200" height="70" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="578" y="121" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Snapshot store</text><text x="578" y="136" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[S3 + metadata DB]</text><line x1="492" y1="148" x2="664" y2="148" stroke="#ccc" stroke-width="1"/><text x="578" y="163" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Named by team+PR.</text><text x="578" y="180" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Manifest: resources,</text><text x="578" y="197" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">git SHA, timestamp,</text><text x="578" y="214" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">test results link.</text><line x1="678" y1="135" x2="718.0" y2="135.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="703.0" y="125.0" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">index</text><rect x="728" y="100" width="200" height="70" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="828" y="121" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Snapshot index</text><text x="828" y="136" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[PostgreSQL]</text><line x1="742" y1="148" x2="914" y2="148" stroke="#ccc" stroke-width="1"/><text x="828" y="163" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">List by team.</text><text x="828" y="180" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Search by PR / SHA.</text><text x="828" y="197" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Tag: 'release-1.2',</text><text x="828" y="214" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">'bug-PLAT-123'.</text><text x="480" y="210" font-size="13" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#333">Restore flow</text><rect x="18" y="222" width="160" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="98" y="243" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Restore request</text><text x="98" y="258" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Portal / CLI]</text><line x1="32" y1="270" x2="164" y2="270" stroke="#ccc" stroke-width="1"/><text x="98" y="285" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Select snapshot</text><text x="98" y="302" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">by name or tag.</text><text x="98" y="319" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Optionally override</text><text x="98" y="336" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">env.yaml fields.</text><line x1="178" y1="262" x2="218.0" y2="262.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="203.0" y="252.0" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">restore</text><rect x="228" y="222" width="200" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="328" y="243" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Restore engine</text><text x="328" y="258" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[RestoreService]</text><line x1="242" y1="270" x2="414" y2="270" stroke="#ccc" stroke-width="1"/><text x="328" y="285" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">1. Read manifest.</text><text x="328" y="302" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">2. Restore RDS snap.</text><text x="328" y="319" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">3. Copy S3 objects.</text><text x="328" y="336" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">4. Apply env.yaml.</text><text x="328" y="353" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">5. Start ECS.</text><line x1="428" y1="262" x2="468.0" y2="262.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="453.0" y="252.0" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">provision</text><rect x="478" y="222" width="200" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="578" y="243" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Restored env</text><text x="578" y="258" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[pr-{snapshot-name}]</text><line x1="492" y1="270" x2="664" y2="270" stroke="#ccc" stroke-width="1"/><text x="578" y="285" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Identical DB state.</text><text x="578" y="302" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Identical test data.</text><text x="578" y="319" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Same git SHA.</text><text x="578" y="336" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Short TTL (4h).</text><line x1="678" y1="262" x2="718.0" y2="262.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="703.0" y="252.0" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">run tests</text><rect x="728" y="222" width="200" height="80" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="828" y="243" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Test result</text><text x="828" y="258" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Comparison]</text><line x1="742" y1="270" x2="914" y2="270" stroke="#ccc" stroke-width="1"/><text x="828" y="285" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Compare to original</text><text x="828" y="302" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">snapshot run.</text><text x="828" y="319" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Flag regressions.</text><text x="828" y="336" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Link to Jira ticket.</text><rect x="18" y="340" width="460" height="200" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/><text x="240" y="358" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#333">Snapshot manifest schema</text><text x="28" y="376" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">snapshot_id</text><text x="220" y="376" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">uuid — unique per capture</text><text x="28" y="392" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">team / app</text><text x="220" y="392" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">payments-squad / payment-service</text><text x="28" y="408" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">git_sha</text><text x="220" y="408" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">commit hash at time of capture</text><text x="28" y="424" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">pr_number</text><text x="220" y="424" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">source PR number</text><text x="28" y="440" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">env_yaml_hash</text><text x="220" y="440" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">SHA256 of env.yaml</text><text x="28" y="456" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">rds_snapshot_id</text><text x="220" y="456" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">AWS RDS snapshot ARN</text><text x="28" y="472" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">s3_clone_prefix</text><text x="220" y="472" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">s3://snapshots/pr-42/testdata/</text><text x="28" y="488" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">test_result_url</text><text x="220" y="488" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">link to Surefire XML in S3</text><text x="28" y="504" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">tags</text><text x="220" y="504" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">release-1.2, bug-PLAT-123</text><text x="28" y="520" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">created_at / expires_at</text><text x="220" y="520" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#555">capture time / 90-day retention</text><rect x="490" y="340" width="452" height="200" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/><text x="720" y="358" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#333">When to use snapshots</text><text x="500" y="378" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#444">Reproduce a bug</text><text x="500" y="393" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#666">Restore env from the PR where bug first appeared.</text><text x="500" y="410" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#444">Baseline regression</text><text x="500" y="425" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#666">Compare current test results to release snapshot.</text><text x="500" y="442" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#444">Compliance evidence</text><text x="500" y="457" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#666">Keep named snapshot for audit period (90 days).</text><text x="500" y="474" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#444">Perf benchmark</text><text x="500" y="489" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#666">Restore identical data state for load test comparison.</text><text x="500" y="506" font-size="11" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#444">Debug a flaky test</text><text x="500" y="521" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#666">Restore to the exact DB state where the test failed.</text><rect x="18" y="568" width="924" height="100" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/><text x="480" y="584" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#333">Retention and cost policy</text><text x="480" y="604" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#555">Auto snapshots: kept 7 days. Named/tagged snapshots: kept 90 days. Compliance snapshots: kept per policy (up to 7 years).</text><text x="480" y="624" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#555">RDS snapshot ~$0.095/GB/month. S3 clone ~$0.023/GB/month. Cost shown in portal before snapshot is taken.</text><text x="480" y="648" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#777">env.yaml snapshot config:  snapshot: { on_failure: true, on_pr_close: false, tag: release-1.2, retain_days: 90 }</text>
</svg>
