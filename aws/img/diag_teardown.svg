<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#444"/></marker></defs>
<title>Flexible Teardown Architecture</title>
<rect width="960" height="680" fill="white"/>
<rect x="0" y="0" width="960" height="64" fill="#222" stroke="#222" stroke-width="0" rx="0"/><text x="480" y="26" font-size="21" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="white">Flexible Teardown Architecture</text><text x="480" y="50" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#aaa">Four configurable teardown strategies — set per team in env.yaml</text><rect x="300" y="84" width="360" height="70" fill="white" stroke="#222" stroke-width="1.5" rx="6"/><text x="480" y="105" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">TeardownStrategy</text><text x="480" y="120" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Platform orchestrator]</text><line x1="314" y1="132" x2="646" y2="132" stroke="#ccc" stroke-width="1"/><text x="480" y="147" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Reads teardown.strategy from env.yaml.</text><text x="480" y="164" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Delegates to the matching strategy handler.</text><rect x="30" y="200" width="200" height="160" fill="#f5f5f5" stroke="#222" stroke-width="2" rx="6"/><text x="130" y="221" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">immediate</text><text x="130" y="236" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Default]</text><line x1="44" y1="248" x2="216" y2="248" stroke="#ccc" stroke-width="1"/><text x="130" y="263" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Destroy all resources</text><text x="130" y="280" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">on PR close / merge.</text><text x="130" y="297" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Fastest. Zero cost.</text><text x="130" y="314" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Most common strategy.</text><line x1="480" y1="154" x2="139.9" y2="198.7" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><rect x="250" y="200" width="200" height="160" fill="#f5f5f5" stroke="#222" stroke-width="2" rx="6"/><text x="350" y="221" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">scheduled</text><text x="350" y="236" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Destroy at time]</text><line x1="264" y1="248" x2="436" y2="248" stroke="#ccc" stroke-width="1"/><text x="350" y="263" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Keep env alive until</text><text x="350" y="280" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">configured time.</text><text x="350" y="297" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">E.g. destroy at 02:00 UTC.</text><text x="350" y="314" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Good for overnight runs.</text><line x1="480" y1="154" x2="359.4" y2="196.7" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><rect x="470" y="200" width="200" height="160" fill="#f5f5f5" stroke="#222" stroke-width="2" rx="6"/><text x="570" y="221" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">on-demand</text><text x="570" y="236" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Manual trigger]</text><line x1="484" y1="248" x2="656" y2="248" stroke="#ccc" stroke-width="1"/><text x="570" y="263" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Keep alive until a</text><text x="570" y="280" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">manual API call or</text><text x="570" y="297" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">portal button press.</text><text x="570" y="314" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">For debugging sessions.</text><line x1="480" y1="154" x2="561.1" y2="195.4" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><rect x="690" y="200" width="200" height="160" fill="#f5f5f5" stroke="#222" stroke-width="2" rx="6"/><text x="790" y="221" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">partial</text><text x="790" y="236" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Snapshot + slim-down]</text><line x1="704" y1="248" x2="876" y2="248" stroke="#ccc" stroke-width="1"/><text x="790" y="263" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">RDS snapshot saved.</text><text x="790" y="280" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">ECS + ALB destroyed.</text><text x="790" y="297" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Snapshot restorable.</text><text x="790" y="314" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Pay only for storage.</text><line x1="480" y1="154" x2="780.1" y2="198.5" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><rect x="18" y="396" width="924" height="100" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/><text x="480" y="412" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#333">What gets destroyed in each strategy</text><text x="30" y="428" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">Resource</text><text x="200" y="428" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">immediate</text><text x="360" y="428" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">scheduled</text><text x="510" y="428" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">on-demand</text><text x="660" y="428" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="bold" font-style="normal" fill="#333">partial</text><text x="30" y="444" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">ECS service / task</text><text x="200" y="444" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓</text><text x="360" y="444" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ at time</text><text x="510" y="444" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ on trigger</text><text x="660" y="444" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ immediately</text><text x="30" y="460" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">RDS instance</text><text x="200" y="460" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓</text><text x="360" y="460" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ at time</text><text x="510" y="460" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ on trigger</text><text x="660" y="460" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">RDS snapshot kept</text><text x="30" y="476" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">S3 bucket</text><text x="200" y="476" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓</text><text x="360" y="476" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ at time</text><text x="510" y="476" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ on trigger</text><text x="660" y="476" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ immediately</text><text x="30" y="492" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">Secrets Manager</text><text x="200" y="492" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓</text><text x="360" y="492" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ at time</text><text x="510" y="492" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ on trigger</text><text x="660" y="492" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ immediately</text><text x="30" y="508" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">VPC / networking</text><text x="200" y="508" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓</text><text x="360" y="508" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ at time</text><text x="510" y="508" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ on trigger</text><text x="660" y="508" font-size="10" font-family="Arial,sans-serif" text-anchor="start" font-weight="normal" font-style="normal" fill="#444">✓ immediately</text><rect x="18" y="534" width="924" height="80" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/><text x="480" y="552" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#333">TTL watchdog override</text><text x="480" y="572" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#555">Regardless of teardown strategy, the TTL watchdog destroys any environment</text><text x="480" y="590" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#555">older than max_ttl (platform-wide cap, default 8h). Teams cannot override this.</text><text x="480" y="614" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#777">env.yaml teardown config:  teardown: { strategy: partial, scheduled_time: 02:00, max_keep_alive: 4h }</text>
</svg>
