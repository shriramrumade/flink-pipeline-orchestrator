lic" fill="#888">reads cost/audit</text><line x1="630" y1="175" x2="670.6" y2="160.4" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="655.0" y="156.0" font-size="10" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">PR trigger/results</text><line x1="630" y1="225" x2="670.0" y2="221.8" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="655.0" y="213.0" font-size="10" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">provision &amp; destroy</text><line x1="630" y1="275" x2="670.2" y2="283.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="655.0" y="270.0" font-size="10" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">read credentials</text><line x1="630" y1="325" x2="671.0" y2="344.7" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="655.0" y="327.0" font-size="10" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">emit telemetry</text><line x1="630" y1="375" x2="672.0" y2="406.9" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="655.0" y="384.0" font-size="10" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">send notifications</text><line x1="630" y1="425" x2="673.1" y2="469.8" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="655.0" y="441.0" font-size="10" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">quality gate</text><line x1="630" y1="475" x2="674.0" y2="533.0" stroke="#444" stroke-width="1" marker-end="url(#ah)"/><text x="655.0" y="498.0" font-size="10" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#888">ship logs</text>
