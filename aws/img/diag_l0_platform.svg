<rect x="0" y="0" width="940" height="64" fill="#222" stroke="#222" stroke-width="0" rx="0"/><text x="470" y="26" font-size="21" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="white">Level 0 — System Context</text><text x="470" y="50" font-size="12" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#aaa">Enterprise Ephemeral Test Platform · all actors and external systems</text><rect x="310" y="140" width="320" height="150" fill="#f5f5f5" stroke="#222" stroke-width="2" rx="6"/><text x="470" y="161" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Ephemeral Test Platform</text><text x="470" y="176" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Software System]</text><line x1="324" y1="188" x2="616" y2="188" stroke="#ccc" stroke-width="1"/><text x="470" y="203" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">Provisions isolated infra per PR,</text><text x="470" y="220" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">runs integration tests, destroys</text><text x="470" y="237" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#444">all resources on completion.</text><circle cx="90" cy="150" r="12" fill="white" stroke="#222" stroke-width="1.5"/><line x1="90" y1="162" x2="90" y2="186" stroke="#222" stroke-width="1.5"/><line x1="72" y1="170" x2="108" y2="170" stroke="#222" stroke-width="1.5"/><line x1="90" y1="186" x2="76" y2="206" stroke="#222" stroke-width="1.5"/><line x1="90" y1="186" x2="104" y2="206" stroke="#222" stroke-width="1.5"/><text x="90" y="222" font-size="13" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Dev / App team</text><text x="90" y="238" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Person]</text><text x="90" y="256" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">Writes env.yaml, opens PRs.</text><circle cx="90" cy="340" r="12" fill="white" stroke="#222" stroke-width="1.5"/><line x1="90" y1="352" x2="90" y2="376" stroke="#222" stroke-width="1.5"/><line x1="72" y1="360" x2="108" y2="360" stroke="#222" stroke-width="1.5"/><line x1="90" y1="376" x2="76" y2="396" stroke="#222" stroke-width="1.5"/><line x1="90" y1="376" x2="104" y2="396" stroke="#222" stroke-width="1.5"/><text x="90" y="412" font-size="13" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Platform team</text><text x="90" y="428" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Person]</text><text x="90" y="446" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">Operates the platform.</text><circle cx="90" cy="500" r="12" fill="white" stroke="#222" stroke-width="1.5"/><line x1="90" y1="512" x2="90" y2="536" stroke="#222" stroke-width="1.5"/><line x1="72" y1="520" x2="108" y2="520" stroke="#222" stroke-width="1.5"/><line x1="90" y1="536" x2="76" y2="556" stroke="#222" stroke-width="1.5"/><line x1="90" y1="536" x2="104" y2="556" stroke="#222" stroke-width="1.5"/><text x="90" y="572" font-size="13" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Finance / Auditors</text><text x="90" y="588" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[Person]</text><text x="90" y="606" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="italic" fill="#666">Reads cost &amp; audit data.</text><rect x="680" y="130" width="220" height="54" fill="#fafafa" stroke="#222" stroke-width="1" rx="6" stroke-dasharray="6 4"/><text x="790" y="149" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">GitHub / GitLab</text><text x="790" y="167" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[External]</text><rect x="680" y="194" width="220" height="54" fill="#fafafa" stroke="#222" stroke-width="1" rx="6" stroke-dasharray="6 4"/><text x="790" y="213" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">AWS / GCP / K8s</text><text x="790" y="231" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[External]</text><rect x="680" y="258" width="220" height="54" fill="#fafafa" stroke="#222" stroke-width="1" rx="6" stroke-dasharray="6 4"/><text x="790" y="277" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Vault / Secrets Mgr</text><text x="790" y="295" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[External]</text><rect x="680" y="322" width="220" height="54" fill="#fafafa" stroke="#222" stroke-width="1" rx="6" stroke-dasharray="6 4"/><text x="790" y="341" font-size="14" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" font-style="normal" fill="#222">Datadog / Grafana</text><text x="790" y="359" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" font-weight="normal" font-style="normal" fill="#666">[External]</text><rect x="680" y="386" width="220" height="54" fill="#fafafa" stroke="#222" stroke-wi